<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PintOS 1주차 [Thread] · 9팀</title>
<!--
  Team 9 talk: three decks shown one after another in the same tab.
  1. circular-list.html (benjohnbill) 2. lock-holder-intr.html (Jun) 3. only-what-changed.html (Yena)
  Each deck keeps its own runtime. A key press that does not move the deck
  (past its last step, or before its first) moves to the next or previous deck.
  The decks must have the same origin as this page (GitHub Pages, or a local
  server); file:// blocks the key hook.
-->
<style>
html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; }
iframe.on { visibility: visible; }
</style>
</head>
<body>
<iframe src="circular-list.html" title="1. benjohnbill · list에서 끝을 없앴더니"></iframe>
<iframe src="lock-holder-intr.html" title="2. Jun · 핸들러는 잠들 수 없다"></iframe>
<iframe src="only-what-changed.html" title="3. Yena · 4틱마다 전부? 바뀐 것만"></iframe>
<script>
const frames = [...document.querySelectorAll('iframe')];
let cur = 0;
const FWD = ['ArrowRight', 'ArrowDown', 'PageDown', ' '];
const BACK = ['ArrowLeft', 'ArrowUp', 'PageUp'];

/* What the deck shows now: its scroll position and every slide's classes and data attributes */
function state(w) {
    const secs = [...w.document.querySelectorAll('section')];
    return w.scrollY + '|' + secs.map(s =>
        s.className + [...s.attributes].filter(a => a.name.startsWith('data-')).map(a => a.name + '=' + a.value).join(';')
    ).join('|');
}

function go(i) {
    if (i < 0 || i >= frames.length || i === cur) return;
    frames[cur].classList.remove('on');
    cur = i;
    frames[cur].classList.add('on');
    frames[cur].contentWindow.focus();
}

frames.forEach((f, i) => f.addEventListener('load', () => {
    const w = f.contentWindow;
    w.addEventListener('keydown', e => {
        if (i !== cur || e.ctrlKey || e.metaKey || e.altKey || e.target.isContentEditable) return;
        const dir = FWD.includes(e.key) ? 1 : BACK.includes(e.key) ? -1 : 0;
        if (!dir) return;
        const before = state(w);
        setTimeout(() => { if (i === cur && state(w) === before) go(cur + dir); }, 150);
    }, true);
    if (i === cur) w.focus();
}));
frames[0].classList.add('on');
</script>
</body>
</html>
