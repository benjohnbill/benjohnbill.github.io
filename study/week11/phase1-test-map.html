<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 1 대상별 테스트 정의</title><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground);font:14px/1.6 var(--font-sans)}h1,h2,p{margin:0}h1{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:4px 0 8px}.small{font-size:11px;color:var(--muted-foreground)}.tabs,.targets{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{font:12px var(--font-sans);padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted-foreground);cursor:pointer}button.on{border-color:var(--chart-1);color:var(--chart-1);background:color-mix(in oklab,var(--chart-1) 8%,transparent)}.definition{margin-top:20px}.definition h2{font-size:19px;font-weight:600;letter-spacing:-.02em}.definition p{margin-top:6px;font-size:13px}.map{width:100%;display:block;margin-top:20px;overflow:visible}.edge{fill:none;stroke:var(--border);stroke-width:1.5}.edge.on{stroke:var(--chart-1);stroke-width:1.8}.node rect{fill:var(--surface-primary);stroke:var(--border)}.node text{font:12px var(--font-sans);fill:var(--foreground)}.node .title{font-weight:600}.node .sub{font-size:11px;fill:var(--muted-foreground)}.node.pick{cursor:pointer;outline:none}.node.pick:hover rect,.node.pick:focus rect{stroke:var(--chart-1)}.node.on rect{stroke:var(--chart-1);fill:color-mix(in oklab,var(--chart-1) 10%,var(--surface-primary))}.node.dim{opacity:.65}.detail{border-top:1px solid var(--border);padding-top:16px;margin-top:8px}.detail h2{font-size:17px;font-weight:600}.detail p{font-size:13px;margin-top:6px}.decision{color:var(--chart-3)}footer{font-size:12px;color:var(--muted-foreground);border-top:1px solid var(--border);margin-top:20px;padding-top:14px}footer p+p{margin-top:7px}</style><link rel="stylesheet" href="https://benjohnbill.github.io/assets/site.css"><style>/* Preserve the compact interactive map's original SVG geometry; use shared site colors and font slots. */:root{--foreground:var(--ink);--muted-foreground:var(--ink-2);--surface-primary:var(--surface);--border:var(--line);--chart-1:var(--s3);--chart-3:var(--s4);--font-sans:var(--font-body)}body{background:var(--bg)}.wrap{max-width:1040px;margin:0 auto;padding:28px 24px 48px}.home{display:inline-block;margin-bottom:20px}.node rect{fill:none}.node.on rect{fill:var(--s3-soft)}button{background:transparent}header h1,.definition h2,.detail h2{font-family:var(--font-head)}</style></head><body><main class="wrap"><a class="home" href="https://benjohnbill.github.io/">← 학습 기록</a><script>(()=>{const root=document.documentElement;if(!getComputedStyle(root).getPropertyValue("--foreground").trim()){root.style.colorScheme="light dark";const vars={"--foreground":"CanvasText","--muted-foreground":"GrayText","--surface-primary":"color-mix(in oklab, CanvasText 5%, Canvas)","--border":"color-mix(in oklab, CanvasText 20%, Canvas)","--chart-1":"Highlight","--chart-3":"Highlight","--font-sans":"system-ui, sans-serif"};for(const [key,value] of Object.entries(vars))root.style.setProperty(key,value);}})();</script><header><div class="small">Phase 1 · 13개 상위 대상 · 57개 검증 갈래</div><h1>책임에서 검증할 성질로</h1><p class="small">레벨과 대상을 선택한 뒤 갈래를 누르면 도출 과정을 볼 수 있어요.</p></header><nav id="levels" class="tabs" aria-label="테스트 레벨"></nav><nav id="targets" class="targets" aria-label="테스트 대상"></nav><section id="definition" class="definition"></section><svg id="map" class="map" role="group" aria-label="대상의 책임과 검증 성질"></svg><section id="detail" class="detail" aria-live="polite"></section><footer><p>갈래 수는 실행 테스트 수가 아니에요. 기존 사례와 보완 후보, 기대 결과는 설계·재고 문서에 연결했어요.</p><p>기본 Phase 1과 선택 key 확장을 분리했어요. [결정 필요]는 코딩 세션이 임의로 정하지 않아요. 테스트 코드 생성과 실행은 이번 작업에 포함하지 않았어요.</p></footer><script>(()=>{const data=[{"id":"U-FROM","l":"단위","n":"createVNodeFromDom","d":"지원하는 DOM을 합의된 VNode 표현으로 읽고, 입력 DOM은 변경하지 않는다.","r":"DOM의 종류·속성·자식·글자·입력 상태를 읽되 원본은 보존","g":[{"n":"노드 표현과 입력 범위","p":"빈 요소와 지원 노드 종류를 정해진 형태로 반환한다.","f":"DOM 노드 종류 → 지원 입력과 반환 형태","q":["DEC-02"]},{"n":"속성의 존재와 값","p":"여러 문자열 속성과 빈 값 속성을 빠뜨리지 않는다.","f":"attributes → 없음·하나·여럿·빈 값","q":[]},{"n":"자식 구조와 경계","p":"중첩·순서·빈 요소와 합의한 Text 경계를 유지한다.","f":"childNodes → 깊이·형제·종류·빈 자리","q":["DEC-01","DEC-04"]},{"n":"글자와 공백 정책","p":"엔티티가 해석된 글자를 읽고 합의한 공백 정책을 적용한다.","f":"Text.data → 일반 글자·공백-only·pre","q":["DEC-01"]},{"n":"주석 제외","p":"주석은 VNode에서 제외하되 입력 DOM에서는 지우지 않는다.","f":"주석 제외 → VNode 표현과 원본 보존 분리","q":["DEC-02"]},{"n":"현재 입력값","p":"초기 속성이 아니라 입력칸의 현재 value를 읽는다.","f":"attribute와 property 차이 → 초기·입력·지움","q":["DEC-03"]},{"n":"입력 DOM 보존","p":"읽기 전후 구조·참조·현재 입력값을 바꾸지 않는다.","f":"읽기 책임 → outerHTML 밖의 상태도 보존","q":[]}]},{"id":"U-TO","l":"단위","n":"createDomFromVNode","d":"VNode의 구조와 값을 새 DOM으로 만들고 문자열을 HTML로 해석하지 않으며 입력 VNode를 보존한다.","r":"VNode의 type·props·children을 새 DOM으로 표현","g":[{"n":"노드 생성","p":"문자열은 Text, 요소는 해당 태그의 새 노드로 만든다.","f":"VNode 종류 → DOM 노드 종류","q":[]},{"n":"속성 반영","p":"속성값뿐 아니라 빈 속성의 존재도 반영한다.","f":"props → attribute 존재와 값","q":[]},{"n":"자식 구조와 순서","p":"중첩·혼합·빈 자식을 적힌 순서대로 만든다.","f":"children → nodeType·개수·순서","q":["DEC-01","DEC-04"]},{"n":"문자열은 글자","p":"HTML 모양과 엔티티 표기도 문자열 그대로 만든다.","f":"문자열 VNode → Text 하나","q":[]},{"n":"입력 표시값","p":"props.value가 새 입력칸의 현재 value로 보인다.","f":"input VNode → input.value","q":[]},{"n":"입력 보존과 새 결과","p":"VNode를 바꾸지 않고 서로 독립된 새 DOM을 반환한다.","f":"create 책임 → 입력 비변경·결과 독립","q":[]}]},{"id":"U-INPUT","l":"단위","n":"isTextInput","d":"reader와 Patch가 현재 value를 다룰 input 대상을 같은 규칙으로 분류한다.","r":"현재 value를 상태로 읽고 쓸 대상인지 분류","g":[{"n":"기본 입력칸","p":"기본 input과 text input을 포함한다.","f":"입력 요소 → 현재값 적용 대상","q":[]},{"n":"checked 계열 제외","p":"checkbox와 radio를 value 상태 대상으로 오인하지 않는다.","f":"현재 상태가 checked인 요소 → 제외","q":[]},{"n":"비입력 요소 제외","p":"value를 가진 li·button을 입력칸으로 오인하지 않는다.","f":"property 존재와 입력 역할은 별개","q":[]}]},{"id":"U-DIFF","l":"단위","n":"diffViews","d":"두 View의 차이를 Patch 목록으로 반환하고, 입력 View와 DOM은 바꾸지 않는다. 기본 비교는 key 없는 위치 비교다.","r":"두 View의 차이를 판단하고 위치를 표현하되 입력은 보존","g":[{"n":"변경 없음","p":"내용이 같으면 참조나 속성 순서가 달라도 Patch가 없다.","f":"내용 비교 → 동등함과 참조 동일성 구별","q":[]},{"n":"노드 종류와 태그","p":"종류·태그가 바뀌면 해당 범위만 교체하고 자손 변경을 중복 생성하지 않는다.","f":"VNode 종류와 type → 유지 또는 교체","q":["DEC-05"]},{"n":"문자열 내용","p":"빈 글자와 공백을 포함한 새 문자열을 정확히 전달한다.","f":"문자열 VNode → 내용 차이","q":[]},{"n":"속성의 존재와 값","p":"속성 없음과 빈 값을 구분하고 추가·변경·삭제를 빠뜨리지 않는다.","f":"props의 키와 값 → 설정 또는 삭제","q":["DEC-03"]},{"n":"자식 개수와 위치","p":"자식의 추가·삭제와 남은 위치의 변경을 함께 찾는다.","f":"children 순서와 길이 → 위치별 비교","q":[]},{"n":"중첩 위치와 변경 조합","p":"여러 가지의 변경을 충돌 없는 정확한 경로에 표현한다.","f":"재귀 비교 → 경로와 batch 순서","q":["DEC-05"]},{"n":"입력 보존과 호출 독립성","p":"입력을 바꾸지 않고 호출 사이에 결과가 섞이지 않는다.","f":"비교 결과만 반환 → 입력과 호출 영향 제한","q":[]}]},{"id":"U-PATCH","l":"단위","n":"applyPatchesToDom","d":"합의된 Patch를 container 안의 View에 적용하고 변경 대상 밖의 노드와 container를 보존한다.","r":"각 변경 지시를 올바른 노드에 적용하고 나머지는 유지","g":[{"n":"변경 범위와 노드 보존","p":"TEXT·PROPS는 대상과 이웃의 필요한 참조를 유지한다.","f":"부분 갱신 → 내용뿐 아니라 Node identity","q":[]},{"n":"구조와 루트","p":"삽입·삭제·교체는 정확한 구조를 만들고 container는 유지한다.","f":"Patch 종류 → 구조 변화와 유지 범위","q":["DEC-05"]},{"n":"VNode와 DOM의 위치 대응","p":"주석을 제외하고 합의한 Text 노드를 세어 의도한 대상을 수정한다.","f":"VNode children 번호 → 실제 childNodes 대응","q":["DEC-01","DEC-04"]},{"n":"글자·속성·현재 입력값","p":"글자는 HTML이 아니며 빈 속성과 live 빈 입력값을 구분해 반영한다.","f":"TEXT·PROPS → Text.data·attribute·property","q":[]},{"n":"무변경·순차 적용·실패","p":"빈 batch는 무변경이고 순차 적용과 실패는 정해진 약속을 따른다.","f":"목록 처리 → 순서·불변·오류 경계","q":["DEC-05","DEC-13"]}]},{"id":"U-HISTORY","l":"단위","n":"StateHistory","d":"View의 저장 순서와 현재 위치를 관리하고 저장·조회·이동·격리의 약속을 지킨다.","r":"저장된 View와 현재 위치를 일관되게 관리","g":[{"n":"초기와 현재 조회","p":"빈 상태와 첫 저장 후의 현재·개수·이동 가능 여부가 일치한다.","f":"저장 집합과 현재 위치 → 공개 조회","q":["DEC-06"]},{"n":"이동과 경계","p":"앞뒤 이동은 정확한 View를 선택하고 경계에서는 현재를 유지한다.","f":"순서 있는 이력 → 이전·다음·범위 경계","q":[]},{"n":"새 저장과 분기","p":"과거에서 새 View를 저장하면 redo를 버리고 과거 prefix를 보존한다.","f":"현재 위치에서 저장 → 새 가지","q":["DEC-07"]},{"n":"스냅샷 격리","p":"원본과 조회 결과를 수정해도 저장 당시 내용은 유지된다.","f":"View 참조의 입출력 → 외부 변경 차단","q":["DEC-08"]},{"n":"선택: 용량 제한","p":"선택한 상한을 넘으면 오래된 이력부터 제거한다.","f":"선택 capacity → 보관 범위","q":[]}]},{"id":"I-ROUND","l":"통합","n":"변환 왕복","d":"두 변환을 연결했을 때 지원하는 정규형의 구조와 현재 상태가 합의한 범위에서 보존된다.","r":"두 변환의 표현 약속이 서로 맞는지 확인","g":[{"n":"VNode→DOM→VNode","p":"정규형 VNode를 만들고 다시 읽으면 같은 내용을 얻는다.","f":"두 변환 합성 → 표현 정합성","q":["DEC-02"]},{"n":"DOM→VNode→DOM","p":"지원 DOM의 구조와 글자가 합의한 정규화 후 보존된다.","f":"반대 방향 합성 → 구조 보존","q":[]},{"n":"입력 상태와 의도적 정보손실","p":"현재 입력값은 보존하고 주석·정규화 예외는 명시적으로 검사한다.","f":"합성의 보존 범위 → equality 예외","q":["DEC-01"]}]},{"id":"I-DP","l":"통합","n":"Diff → Patch","d":"이전 DOM에 두 View의 diff를 적용하면 목표 View의 상태가 되고 변경 없는 노드는 유지된다.","r":"차이 지시의 생성자와 소비자가 같은 약속을 쓰는지 확인","g":[{"n":"목표 상태 도달","p":"텍스트·속성·자식·교체를 연결했을 때 목표 구조가 된다.","f":"diff 결과 → 실제 Patch 반영","q":[]},{"n":"불필요한 변경 없음","p":"no-op과 국소 변경에서 바꾸지 않을 Node는 그대로 남는다.","f":"목표 내용 외의 보장 → identity·mutation","q":[]},{"n":"연속 변경과 재현성","p":"매 단계 새 diff를 계산해도 내용·live 값·보존 범위가 맞는다.","f":"반복 사용 → 기준 View 갱신과 오류 재현","q":[]}]},{"id":"I-READDP","l":"통합","n":"DOM 읽기 → Diff → Patch","d":"DOM에서 읽은 구조와 현재 입력값을 diff와 Patch가 같은 의미로 해석해 정확한 대상을 바꾼다.","r":"읽기·비교·반영 사이의 데이터와 위치 계약 확인","g":[{"n":"주석·공백·빈 Text의 경로","p":"reader가 만든 children 번호와 Patch의 노드 탐색이 일치한다.","f":"정규화 → VNode 번호 → 실제 DOM 위치","q":["DEC-01"]},{"n":"live value의 빈 값","p":"현재 value를 읽고 비교해 지운 빈 값까지 같은 input에 반영한다.","f":"property 읽기 → value Patch → property 쓰기","q":["DEC-03"]}]},{"id":"I-HR","l":"통합","n":"History → 화면 복원","d":"반영한 View를 저장하고 선택한 이력을 두 영역에 복원하며 이력과 화면의 현재 상태를 일치시킨다.","r":"저장과 복원의 협력 관계를 실제 경로로 검증","g":[{"n":"초기 저장과 커밋 연결","p":"처음 상태를 한 번 저장하고 첫 변경 뒤에도 처음으로 돌아갈 수 있다.","f":"초기화·반영·저장 → 첫 상태 보존","q":[]},{"n":"두 영역과 현재의 일치","p":"앞뒤 이동을 반복해도 두 화면과 현재 View가 선택 상태와 같다.","f":"이력 선택 → 두 영역 복원","q":[]},{"n":"분기·no-op·거절 입력","p":"새 분기는 redo를 버리고 no-op과 거절 입력은 저장을 만들지 않는다.","f":"커밋 가능 여부 → 저장·redo 관계","q":["DEC-07"]}]},{"id":"F-INIT","l":"기능","n":"최초 표시","d":"페이지 로드 시 실제 영역의 샘플을 독립된 테스트 영역에 표시하고 초기 이력과 버튼을 준비한다.","r":"로드 동작 → 초기 화면·독립성·이력 준비","g":[{"n":"필수 UI와 초기 내용","p":"두 영역과 세 버튼이 있고 두 영역의 View가 초기 기대와 같다.","f":"페이지 준비 → 관찰 가능한 UI","q":["DEC-11"]},{"n":"복사 독립성과 미적용 편집","p":"테스트 영역만 편집해도 실제 영역과 저장 상태는 바뀌지 않는다.","f":"독립된 편집 사본 → 참조 비공유","q":[]},{"n":"초기 이력과 버튼","p":"초기 기록 하나에서 양방향 이동 버튼은 비활성이다.","f":"저장된 첫 상태 → 이동 가능 여부","q":[]}]},{"id":"F-PATCH","l":"기능","n":"Patch 버튼","d":"현재 테스트 편집을 읽어 바뀐 부분만 실제 영역에 반영하고 유효한 새 View를 저장한다.","r":"현재 편집을 검증한 뒤 부분 반영하고 저장","g":[{"n":"현재 편집과 반복 반영","p":"매번 현재 테스트 상태를 읽어 글자·속성·구조를 반영한다.","f":"입력·클릭 → 읽기·비교·반영","q":[]},{"n":"부분 갱신과 no-op","p":"한 곳 변경은 그곳만 바꾸고 무변경은 DOM과 이력을 유지한다.","f":"변경 유무 → 실제 갱신 범위","q":[]},{"n":"반영과 이력 저장","p":"변경 완료 후 그 상태를 복원 가능한 새 이력으로 만든다.","f":"커밋 완료 → 저장과 버튼 갱신","q":["DEC-10"]},{"n":"유효성·브라우저 파싱·안전","p":"빈 입력과 다중 루트는 거절하고 보정 HTML과 정제 결과는 시트 기대를 따른다.","f":"사용자 HTML → 검사·파싱·정제 → 반영","q":["DEC-11"]},{"n":"실제 입력과 조합","p":"실제 입력의 완성값이 Patch와 이력 이동 후에도 맞게 나타난다.","f":"브라우저 키 입력 → 현재값 캡처","q":["DEC-14"]},{"n":"빠른 조작의 재현성","p":"정해진 빠른 조작열 뒤 두 영역과 기대 최종 상태가 맞고 오류가 없다.","f":"연속 이벤트 → 완료 순서와 상태 일관성","q":[]}]},{"id":"F-NAV","l":"기능","n":"뒤로가기·앞으로가기","d":"선택한 저장 상태로 실제 영역과 테스트 영역을 함께 바꾸고 이동 가능 상태와 분기를 일치시킨다.","r":"이력 이동 → 두 화면 동기화·경계·분기","g":[{"n":"두 영역 동기화","p":"뒤로와 앞으로 이동하면 두 영역이 해당 저장 상태를 보여준다.","f":"이력 선택 → 사용자 화면 결과","q":[]},{"n":"시작·끝과 버튼","p":"처음까지 돌아갈 수 있고 시작·끝 버튼 상태가 이동 가능 여부와 맞다.","f":"현재 위치 → 경계와 UI","q":[]},{"n":"분기 후 재생","p":"과거에서 새 변경을 반영하면 예전 redo는 재등장하지 않는다.","f":"뒤로 이동 후 커밋 → 새 가지","q":["DEC-09"]},{"n":"미저장 편집과 선택 복원","p":"미저장 편집 후 이동의 결과는 합의된 정책으로 고정한다.","f":"편집 중 이동 → 버림·저장·거절의 정책","q":["DEC-10"]}]}];const ns='http://www.w3.org/2000/svg';const svg=document.getElementById('map');let level='단위',id='U-FROM',selected=0;function current(){return data.find(t=>t.id===id);}function make(tag,a,parent){const e=document.createElementNS(ns,tag);for(const k in a)e.setAttribute(k,a[k]);if(parent)parent.appendChild(e);return e;}function text(parent,x,y,s,c){const e=make('text',{x,y,class:c},parent);e.textContent=s;}function lines(s,n){const out=[];for(let i=0;i<s.length;i+=n)out.push(s.slice(i,i+n));return out;}function box(x,y,w,h,title,sub,index){const active=index===selected,g=make('g',{transform:'translate('+x+','+y+')',class:'node'+(index!==undefined?' pick'+(active?' on':' dim'):'')},svg);make('rect',{width:w,height:h,rx:8},g);text(g,13,23,title,'title');lines(sub,Math.max(14,Math.floor((w-26)/10))).slice(0,3).forEach((s,i)=>text(g,13,43+i*16,s,'sub'));if(index!==undefined){g.setAttribute('role','button');g.setAttribute('tabindex',0);g.setAttribute('aria-label',title);g.setAttribute('aria-pressed',active);const go=()=>{selected=index;detail();draw();};g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};}}function draw(){const t=current(),w=Math.max(280,Math.floor(svg.getBoundingClientRect().width)),narrow=w<600;svg.replaceChildren();let h;if(narrow){box(0,0,w,86,'대상의 책임',t.r);t.g.forEach((g,i)=>{const y=112+i*88;make('path',{d:'M 9 '+(i?y-24:86)+' V '+(y+36)+' H 26',class:'edge'+(i===selected?' on':'')},svg);box(26,y,w-26,76,String(i+1).padStart(2,'0')+' '+g.n,g.p,i);});h=106+t.g.length*88;}else{const x=274,r=w-x,rootY=Math.max(0,(t.g.length*84-110)/2);t.g.forEach((g,i)=>make('path',{d:'M 224 '+(rootY+52)+' C 250 '+(rootY+52)+',250 '+(i*84+35)+','+x+' '+(i*84+35),class:'edge'+(i===selected?' on':'')},svg));box(0,rootY,224,110,'대상의 책임',t.r);t.g.forEach((g,i)=>box(x,i*84,r,74,String(i+1).padStart(2,'0')+' '+g.n,g.p,i));h=t.g.length*84;}svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.style.height=h+'px';}function detail(){const g=current().g[selected],e=document.getElementById('detail');e.replaceChildren();const title=document.createElement('h2');title.textContent=g.n;e.appendChild(title);const p=document.createElement('p');p.textContent=g.f;e.appendChild(p);const q=document.createElement('p');q.className='small'+(g.q.length?' decision':'');q.textContent=g.q.length?'관련 결정: '+g.q.join(', ')+' · 상세 문서 참조':'기존 사례·보완 조건·검증 범위는 상세 문서 참조';e.appendChild(q);}function render(){const levels=document.getElementById('levels');levels.replaceChildren();['단위','통합','기능'].forEach(l=>{const b=document.createElement('button');b.textContent=l;b.className=l===level?'on':'';b.onclick=()=>{level=l;id=data.find(t=>t.l===l).id;selected=0;render();};levels.appendChild(b);});const targets=document.getElementById('targets');targets.replaceChildren();data.filter(t=>t.l===level).forEach(t=>{const b=document.createElement('button');b.textContent=t.n;b.className=t.id===id?'on':'';b.onclick=()=>{id=t.id;selected=0;render();};targets.appendChild(b);});const t=current(),definition=document.getElementById('definition');definition.replaceChildren();const tag=document.createElement('div');tag.className='small';tag.textContent=t.id+' · '+t.l;const title=document.createElement('h2');title.textContent=t.n;const p=document.createElement('p');p.textContent=t.d;definition.append(tag,title,p);detail();draw();}let width=0;new ResizeObserver(entries=>{const next=Math.round(entries[0].contentRect.width);if(next!==width){width=next;requestAnimationFrame(draw);}}).observe(document.body);render();})();</script></main></body></html>
